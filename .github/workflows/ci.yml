name: Dataset HTTP regression baseline
on:
  push:
    branches: ['validation/dataset-http-baseline']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - name: Prepare offline test guard
        run: |
          mkdir -p "$RUNNER_TEMP/cohere-offline-guard"
          cat > "$RUNNER_TEMP/cohere-offline-guard/sitecustomize.py" <<'PY'
          import socket
          def deny_network(*args, **kwargs):
              raise AssertionError("Network access is disabled during offline SDK tests")
          socket.socket.connect = deny_network
          socket.socket.connect_ex = deny_network
          PY
      - name: Reproduce against unchanged source
        run: poetry run env PYTHONPATH="$RUNNER_TEMP/cohere-offline-guard:$PWD/src" pytest -q tests/test_dataset_utils.py
